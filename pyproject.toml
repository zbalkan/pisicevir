[build-system]
requires = ["setuptools>=68,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "pisicevir"
dynamic = ["version"]
description = "Policy-driven external package importer and native PISI recipe generator"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Zafer Balkan" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "PyYAML>=6,<7",
    "pydantic>=2.7,<3",
    "zstandard>=0.20,<1",
]

[project.optional-dependencies]
gui = ["PyQt5>=5.15,<6"]
test = [
    "pytest>=7.4,<10",
    "pytest-qt>=4.2,<5",
    "ruff>=0.9,<1",
    "mypy>=1.13,<3",
]

[project.urls]
Homepage = "https://github.com/zbalkan/pisicevir"
Repository = "https://github.com/zbalkan/pisicevir"
Issues = "https://github.com/zbalkan/pisicevir/issues"

[project.scripts]
pisicevir = "pisicevir.cli:main"
pisicevir-gui = "pisicevir.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyqt5"

[tool.setuptools.dynamic]
version = { attr = "pisicevir.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pisicevir = ["assets/logo.png"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B017"]

[tool.mypy]
python_version = "3.10"
files = ["src/pisicevir/models"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
